name: Checks

on:
  pull_request:
  push:
    # main, master and work run these checks through the deploy workflow.
    branches-ignore: ["main", "master", "work"]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Type-check mobile app
        run: npx tsc --noEmit -p apps/mobile/tsconfig.json

      - name: Bundle mobile app (Android)
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/mobile-export" --clear
